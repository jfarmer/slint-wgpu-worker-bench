[package]
name = "slint-dx12-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
# The run script rewrites this path to the Slint tree under test.
slint = { path = "SLINT_PATH/api/rs/slint", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "unstable-wgpu-30"] }

[profile.release]
panic = "abort"
